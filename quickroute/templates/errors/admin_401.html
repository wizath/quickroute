<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>401 - Unauthorized | QuickRoute Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .error-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 500px;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .error-code {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .error-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .error-message {
            font-size: 1rem;
            margin-bottom: 2rem;
            opacity: 0.8;
            line-height: 1.5;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            font-weight: 500;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: rgba(46, 204, 113, 0.8);
            border-color: rgba(46, 204, 113, 0.9);
        }

        .btn-primary:hover {
            background: rgba(46, 204, 113, 0.9);
        }

        .admin-logo {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .session-note {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 1rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="admin-logo">🎛️ QuickRoute Admin</div>
        <div class="error-icon">🔐</div>
        <div class="error-code">401</div>
        <div class="error-title">Authentication Required</div>
        <div class="error-message">
            You need to log in to access the admin panel.<br>
            Please authenticate to continue.
        </div>

        <div class="action-buttons">
            <a href="/admin/login" class="btn btn-primary">Login to Admin</a>
            <a href="/" class="btn">← Back to Site</a>
        </div>

        <div class="session-note">
            Your session may have expired or you may not have logged in yet.<br>
            Please sign in with your admin credentials.
        </div>
    </div>
</body>
</html>
