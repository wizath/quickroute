version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fastdjango-postgres
    environment:
      POSTGRES_USER: fastdjango
      POSTGRES_PASSWORD: fastdjango123
      POSTGRES_DB: fastdjango
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastdjango"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastDjango App
  app:
    build: .
    container_name: fastdjango-app
    environment:
      DATABASE_URL: postgresql+asyncpg://fastdjango:fastdjango123@postgres:5432/fastdjango
      SECRET_KEY: your-secret-key-change-in-production
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./minimal_postgres.py:/app/main.py
    command: python main.py

volumes:
  postgres_data: